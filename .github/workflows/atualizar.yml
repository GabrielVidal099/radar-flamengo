name: Atualizar notícias

on:
  schedule:
    - cron: "7,37 * * * *" # a cada 30 minutos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar notícias
        run: node scripts/atualizar.mjs
      - name: Salvar
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza notícias"
          git push
