<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar do Flamengo</title>
<meta name="description" content="Jogos, tabela, elenco e notícias do Flamengo em um só app, com um radar 3D do Maracanã.">
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar Fla">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="selo-clip"><circle cx="28" cy="28" r="25"/></clipPath>
    <symbol id="selo" viewBox="0 0 56 56">
      <g clip-path="url(#selo-clip)">
        <rect width="56" height="56" fill="#111"/>
        <rect y="3" width="56" height="8.4" fill="#c20e2b"/><rect y="19.4" width="56" height="8.4" fill="#c20e2b"/>
        <rect y="35.8" width="56" height="8.4" fill="#c20e2b"/><rect y="52.2" width="56" height="8.4" fill="#c20e2b"/>
      </g>
      <circle cx="28" cy="28" r="25" fill="none" stroke="#f4ecec" stroke-width="2.5"/>
      <image href="icons/monograma.png" x="11" y="14" width="34" height="28.2" preserveAspectRatio="xMidYMid meet"/>
    </symbol>
  </defs>
</svg>

<header class="cab">
  <div class="cab-in gut">
    <div class="marca">
      <svg class="selo" aria-hidden="true"><use href="#selo"/></svg>
      <div class="marca-t"><b>Radar do Flamengo</b><span id="sub">Brasileirão · carregando</span></div>
      <div class="status" id="status"><i></i><span>…</span></div>
    </div>
    <nav class="abas" id="abas" aria-label="Seções">
      <a class="aba" href="#/" data-r="inicio">Início</a>
      <a class="aba" href="#/jogos" data-r="jogos">Jogos</a>
      <a class="aba" href="#/tabela" data-r="tabela">Tabela</a>
      <a class="aba" href="#/elenco" data-r="elenco">Elenco</a>
      <a class="aba" href="#/radar" data-r="radar">Radar</a>
      <a class="aba" href="#/mais" data-r="mais">Mais</a>
    </nav>
  </div>
</header>

<main class="gut" id="app" aria-live="polite"><p class="vazio">Carregando…</p></main>
<div id="camada"></div>

<script type="module" src="app.js"></script>
</body>
</html>
